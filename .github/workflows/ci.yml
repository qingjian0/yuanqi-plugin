name: YuanQi CI
on:
  push:
    branches:
      - dev
      - 'work/**'
  pull_request:
    branches:
      - dev
      - 'work/**'
permissions:
  contents: read
jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install declared runtime dependencies
        run: npm install --ignore-scripts --no-package-lock
      - name: Validate DSH Storage Domain declarations
        run: node --input-type=module -e "const m = await import('./src/domain/index.js'); if (m.userSubjectDomainSpec.name !== 'yuanqi_user_subject' || m.yuanqiSubjectDomainSpec.name !== 'yuanqi_subject' || typeof m.createSubjectStore !== 'function') process.exit(1)"
      - name: Verify syntax and tests
        run: npm run check

name: YuanQi CI
on:
  push:
    branches:
      - dev
      - 'work/**'
  pull_request:
    branches:
      - dev
      - 'work/**'
permissions:
  contents: read
jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.9.0
          package-manager-cache: false
      - name: Install declared runtime dependencies
        run: npm install --ignore-scripts --no-package-lock
      - name: Verify Node and resolved DSH peer packages
        run: |
          node --input-type=module -e "
          const [major, minor] = process.versions.node.split('.').map(Number);
          if (major < 24 || (major === 24 && minor < 9)) throw new Error('YuanQi requires Node.js >=24.9.0');
          console.log('Node.js runtime:', process.versions.node);
          "
          npm ls --depth=0 @deepseek-ai/dsh-tools @deepseek-ai/dsh-storage @deepseek-ai/dsh-storage-domain @deepseek-ai/dsh-session @deepseek-ai/dsh-llm @deepseek-ai/dsh-host-webserver @deepseek-ai/dsh-agent @deepseek-ai/dsh-agent-loop
      - name: Validate package root and DSH Storage Domain exports
        run: >-
          node --input-type=module -e "
          const root = await import('./index.js');
          const domain = await import('./src/domain/index.js');
          const storage = await import('@deepseek-ai/dsh-storage-domain');
          for (const key of ['createSubjectStore', 'deriveBirthTimeContext', 'deriveSolarTermContext', 'apparentSunLongitudeDegrees', 'SOLAR_TERMS', 'calculateBaziPillars', 'BAZI_METHODOLOGY', 'deriveInnateBaseline', 'BAZI_HIDDEN_STEMS', 'resolveBirthTimeZone', 'openSubjectDomains', 'userSubjectDomainSpec', 'yuanqiSubjectDomainSpec']) {
            if (!(key in root) || !(key in domain)) throw new Error('missing package export: ' + key);
          }
          for (const key of ['defineDomain', 'domainTable', 'DomainError', 'DomainFacility']) {
            if (!(key in storage)) throw new Error('missing DSH Storage Domain API: ' + key);
          }
          if (root.userSubjectDomainSpec.name !== 'yuanqi_user_subject' || root.yuanqiSubjectDomainSpec.name !== 'yuanqi_subject') process.exit(1);
          const { StorageError } = await import('@deepseek-ai/dsh-storage');
          if (typeof StorageError !== 'function') throw new Error('missing DSH StorageError class');
          console.log('package root import and real DSH Storage Domain exports verified');
          "
      - name: Verify syntax and tests
        run: npm run check
